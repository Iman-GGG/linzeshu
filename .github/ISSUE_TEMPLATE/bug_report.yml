name: Bug 报告
description: 报告一个可以稳定复现的问题
title: "[Bug]: "
labels:
  - bug
  - triage
body:
  - type: markdown
    attributes:
      value: |
        感谢你帮助改进林则鼠。请勿提交密钥、联系方式、真实录音录像、健康信息或其他敏感数据。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际发生了什么？你原本期待什么？
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 看到……
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 问题区域
      options:
        - 微信小程序客户端
        - 相机、麦克风或相册权限
        - 本地记录与统计
        - Mock API
        - 文档
        - 其他
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 请提供手机系统、微信版本、基础库版本或 Node.js 版本等必要信息。
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 脱敏后的日志或截图
      description: 可选。上传前请移除个人信息、位置、真实影像、密钥和令牌。

  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issues，未发现相同问题。
          required: true
        - label: 此报告不包含密钥、个人信息、真实录音录像或其他敏感数据。
          required: true
        - label: 这不是需要私下报告的安全漏洞。
          required: true

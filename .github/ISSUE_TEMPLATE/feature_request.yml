name: 功能建议
description: 提议一个符合项目目标的具体改进
title: "[Feature]: "
labels:
  - enhancement
  - triage
body:
  - type: markdown
    attributes:
      value: |
        请先说明真实使用场景和问题。涉及录音录像、定位、AI 或外部平台对接的建议，需要特别说明隐私和安全影响。

  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 谁在什么情况下遇到了什么问题？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明期望行为、范围和可能的替代方案。
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: 隐私、安全与内容影响
      description: 是否涉及个人数据、敏感权限、健康或法规内容、AI、举报流程或第三方接口？
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: 验证方式
      description: 如何判断该功能已正确完成且不会将规划能力误写为已上线？

  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issues 和路线图，未发现重复建议。
          required: true
        - label: 我没有在此 Issue 中提交敏感信息。
          required: true
